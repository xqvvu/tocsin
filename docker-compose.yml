name: tocsin

services:
  console:
    build:
      context: .
    image: tocsin:local
    init: true
    restart: unless-stopped
    ports:
      - "${TOCSIN_HTTP_PORT:-3000}:3000"
    environment:
      NODE_ENV: "production"
      HOST: "0.0.0.0"
      PORT: "3000"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      # No working default: an empty value makes production fail closed with
      # "BETTER_AUTH_SECRET is required in production". Either set the inline
      # value (generate one with `openssl rand -hex 32`) or point the `_FILE`
      # variable at a mounted Docker/Kubernetes secret file. An inline value
      # always wins, so the file is only read when this one is empty.
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      BETTER_AUTH_SECRET_FILE: "${BETTER_AUTH_SECRET_FILE:-}"
      SERVER_URL: "${SERVER_URL:-http://localhost:3000}"
      TOCSIN_DATABASE_PATH: "/data/tocsin.sqlite"
      TOCSIN_LOG_LEVEL: "${TOCSIN_LOG_LEVEL:-info}"
      TOCSIN_LOG_FORMAT: "${TOCSIN_LOG_FORMAT:-auto}"
      TOCSIN_MAX_WEBHOOK_BYTES: "${TOCSIN_MAX_WEBHOOK_BYTES:-1048576}"
      TOCSIN_WORKER_BATCH_SIZE: "${TOCSIN_WORKER_BATCH_SIZE:-10}"
      TOCSIN_WORKER_INTERVAL_MS: "${TOCSIN_WORKER_INTERVAL_MS:-5000}"
      TOCSIN_WORKER_STALE_RUNNING_MS: "${TOCSIN_WORKER_STALE_RUNNING_MS:-300000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - tocsin-data:/data

volumes:
  tocsin-data:
    name: "tocsin-data"
